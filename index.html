<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173d32"><meta name="description" content="Controle gratuito de vendas, estoque, clientes, fiado e lucro para doces.">
<link rel="manifest" href="manifest.json">
<title>Meu Controle de Doces</title>
<style>
:root{--g:#173d32;--g2:#245746;--bg:#f4f7f5;--card:#fff;--txt:#1d2b25;--muted:#617168;--line:#dce6df;--red:#a52a2a;--gold:#fff2cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:var(--g);color:white;font-weight:650}button.secondary{background:#e5eee8;color:var(--g)}button.danger{background:#a52a2a}button.small{padding:7px 10px;font-size:13px}.apphead{background:var(--g);color:white;padding:18px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.headrow{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:800}.sub{font-size:12px;color:#d0e4d8;margin-top:3px}.status{font-size:11px;background:#ffffff1c;border-radius:99px;padding:6px 9px;white-space:nowrap}.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 92px}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 14px;scrollbar-width:thin}.nav button{flex:0 0 auto;background:#e3ece6;color:var(--g);padding:9px 12px}.nav button.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #173d3207;min-width:0}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:22px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}.sectiontitle{font-size:19px;font-weight:800;margin:6px 0 14px}.muted{color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #cddbd2;border-radius:10px;padding:11px;background:white;color:var(--txt);min-width:0}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.tablewrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;background:#f8faf8}td .muted{font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#e7f1ea;color:#244a37;font-size:13px;margin-bottom:12px}.warn{background:var(--gold);color:#6c4b00}.hidden{display:none!important}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e6eee9;color:#245746;font-size:11px;font-weight:700}.pill.red{background:#fde7e7;color:#982828}.right{text-align:right}.footerhint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:15px}.loginrow{display:flex;gap:8px;flex-wrap:wrap}.loginrow input{flex:1;min-width:160px}.receipt{max-width:500px;margin:auto}.receipt h2{text-align:center}.bottomnav{display:none}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric .value{font-size:20px}.wrap{padding:12px 10px 100px}.apphead{padding:14px 12px}.brand{font-size:17px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.cards{grid-template-columns:1fr}.hide-mobile{display:none}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(6px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));gap:4px;z-index:6;overflow:auto}.bottomnav button{flex:1;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px;min-width:55px}.bottomnav button.active{background:#e6eee9;color:var(--g)}}
@media print{.apphead,.nav,.bottomnav,.no-print,button{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:0}.receipt{display:block!important}}
</style>
</head>
<body>
<header class="apphead"><div class="headrow"><div><div class="brand">🍰 Meu Controle de Doces</div><div class="sub">Vendas • estoque • lucro • fiado</div></div><div class="status" id="modeStatus">Modo local</div></div></header>
<main class="wrap">
<div id="cloudNotice" class="notice warn hidden"></div>
<nav class="nav no-print" id="nav"></nav>
<div id="view"></div>
<div class="footerhint no-print">Seus dados são importantes: use <b>Backup</b> regularmente. Para sincronizar na nuvem, configure o Supabase seguindo o arquivo LEIA-ME.txt. Esta ferramenta não emite nota fiscal.</div>
</main>
<nav class="bottomnav no-print" id="bottomnav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({products:[],clients:[],sales:[],payments:[],expenses:[]});
let db=load(), tab='inicio', supa=null, user=null, cloudConfigured=false, syncTimer=null;
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem('docesDB')||'{}')}}catch{return blank()}}
function saveLocal(){localStorage.setItem('docesDB',JSON.stringify(db)); updateStatus(); if(user&&supa){clearTimeout(syncTimer);syncTimer=setTimeout(syncCloud,800)}}
function id(){return 'D'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase()}
function productByName(name){return db.products.find(p=>p.name===name)}
function saleTotal(s){return Number(s.qty||0)*Number(s.price||0)}
function receivedForSale(s){return s.pay==='Fiado'?db.payments.filter(p=>p.saleId===s.id).reduce((a,p)=>a+Number(p.amount||0),0):Number(s.received??saleTotal(s))}
function debt(s){return Math.max(0,saleTotal(s)-receivedForSale(s))}
function soldQty(name){return db.sales.filter(s=>s.product===name).reduce((a,s)=>a+Number(s.qty||0),0)}
function costForSale(s){return Number(s.qty||0)*Number(s.cost||0)}
function fmtDate(d){if(!d)return '-';let x=d.split('-');return x.length===3?`${x[2]}/${x[1]}/${x[0]}`:d}
function options(items,selected,placeholder){return `<option value="">${placeholder||'Selecione'}</option>`+items.map(x=>`<option ${x===selected?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}
const pages=[['inicio','⌂','Início'],['vender','＋','Vender'],['produtos','▦','Produtos'],['clientes','♙','Clientes'],['fiado','◷','Fiado'],['relatorios','▤','Relatórios'],['backup','⚙','Backup']];
function nav(){let html=pages.map(([k,ic,n])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${ic} ${n}</button>`).join('');$('#nav').innerHTML=html;$('#bottomnav').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function metric(label,val,sub=''){return `<div class="card metric"><div class="label">${label}</div><div class="value">${val}</div>${sub?`<div class="muted">${sub}</div>`:''}</div>`}
function field(label,name,type='text',extra='',value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${type==='number'?'step="0.01" min="0"':''} ${extra} value="${esc(value)}"></div>`}
function selectField(label,name,opts,extra=''){return `<div class="field"><label>${label}</label><select name="${name}" ${extra}>${opts}</select></div>`}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function render(){nav();updateStatus();let v=$('#view');if(tab==='inicio')v.innerHTML=home();if(tab==='vender')v.innerHTML=salesPage();if(tab==='produtos')v.innerHTML=productsPage();if(tab==='clientes')v.innerHTML=clientsPage();if(tab==='fiado')v.innerHTML=debtPage();if(tab==='relatorios')v.innerHTML=reportsPage();if(tab==='backup')v.innerHTML=backupPage();bind(); }
function home(){let d=db.sales.filter(s=>s.date===today()), revenue=d.reduce((a,s)=>a+saleTotal(s),0), profit=d.reduce((a,s)=>a+saleTotal(s)-costForSale(s),0), debtAll=db.sales.reduce((a,s)=>a+debt(s),0), low=db.products.filter(p=>Number(p.stock)-soldQty(p.name)<=3);
return `<h1 class="sectiontitle">Visão geral</h1><div class="grid">${metric('Vendas de hoje',money(revenue),`${d.length} item(ns) registrado(s)`)}${metric('Lucro bruto estimado',money(profit),'Antes de despesas extras')}${metric('Produtos cadastrados',db.products.length)}${metric('Fiado pendente',money(debtAll))}</div>
<div class="cards" style="margin-top:12px"><section class="card"><h3>Atalhos</h3><div class="actions"><button data-go="vender">＋ Registrar venda</button><button class="secondary" data-go="produtos">Cadastrar doce</button><button class="secondary" data-go="clientes">Cadastrar cliente</button></div></section><section class="card"><h3>Estoque baixo</h3>${low.length?low.map(p=>`<p>${esc(p.name)} <span class="pill red">${Math.max(0,Number(p.stock)-soldQty(p.name))} un.</span></p>`).join(''):'<p class="muted">Nenhum produto com 3 unidades ou menos.</p>'}</section></div>
<section class="card" style="margin-top:12px"><h3>Últimas vendas</h3>${salesTable(db.sales.slice().reverse().slice(0,5),false)}</section>`}
function salesTable(list,showActions=true){if(!list.length)return '<div class="empty">Nenhuma venda registrada ainda.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data / ID</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Pagamento</th><th>Saldo</th>${showActions?'<th>Ações</th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td>${fmtDate(s.date)}<div class="muted">${esc(s.id)}</div></td><td>${esc(s.product)}<div class="muted">${esc(s.client||'Sem cliente')}</div></td><td>${s.qty}</td><td>${money(saleTotal(s))}</td><td>${esc(s.pay)}</td><td>${debt(s)>0?`<span class="pill red">${money(debt(s))}</span>`:money(0)}</td>${showActions?`<td><button class="small secondary" data-receipt="${s.id}">Comprovante</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function salesPage(){return `<h1 class="sectiontitle">Registrar venda</h1><div class="cards"><section class="card"><form id="saleForm"><div class="formgrid">
${field('Data','date','date','required',today())}
${field('ID da venda (automático)','id','text','readonly',id())}
${selectField('Produto','product',options(db.products.map(p=>p.name),null,'Cadastre um produto primeiro'),'required')}
${field('Quantidade','qty','number','required min="1" value="1"','1')}
${field('Preço unitário (R$)','price','number','required','')}
${field('Custo unitário (R$)','cost','number','required','')}
${selectField('Cliente','client',options(db.clients.map(c=>c.name),null,'Sem cliente (opcional)'))}
${selectField('Forma de pagamento','pay',options(['Pix','Dinheiro','Cartão','Transferência','Fiado'],'Pix'))}
${field('Valor recebido agora (R$)','received','number','','')}
<div class="field full"><label>Observações</label><textarea name="notes" placeholder="Sabor, entrega, encomenda..."></textarea></div></div><div class="notice" id="saleCalc">Escolha um produto para ver o total.</div><div class="actions"><button type="submit">Salvar venda</button><button type="reset" class="secondary">Limpar</button></div></form></section><section class="card"><h3>Vendas recentes</h3>${salesTable(db.sales.slice().reverse().slice(0,8))}</section></div>`}
function productsPage(){return `<h1 class="sectiontitle">Produtos e estoque</h1><div class="cards"><section class="card"><h3>Cadastrar produto</h3><form id="productForm"><div class="formgrid">${field('Nome do doce','name','text','required')}${field('Sabor / categoria','category')}${field('Custo unitário (R$)','cost','number','required')}${field('Preço de venda (R$)','price','number','required')}${field('Estoque inicial (unidades)','stock','number','required')}</div><div class="actions"><button>Salvar produto</button></div></form></section><section class="card"><h3>Estoque atual</h3><div class="muted">O estoque atual = estoque inicial − vendas registradas.</div>${productsTable()}</section></div>`}
function productsTable(){if(!db.products.length)return '<div class="empty">Cadastre seu primeiro doce.</div>';return `<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Custo</th><th>Preço</th><th>Estoque</th><th>Margem bruta</th><th></th></tr></thead><tbody>${db.products.map(p=>{let st=Number(p.stock)-soldQty(p.name);return `<tr><td>${esc(p.name)}<div class="muted">${esc(p.category||'')}</div></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><span class="pill ${st<=3?'red':''}">${st}</span></td><td>${money(Number(p.price)-Number(p.cost))}</td><td><button class="small danger" data-delproduct="${p.id}">Excluir</button></td></tr>`}).join('')}</tbody></table></div>`}
function clientsPage(){return `<h1 class="sectiontitle">Clientes</h1><div class="cards"><section class="card"><h3>Novo cliente</h3><form id="clientForm"><div class="formgrid">${field('Nome','name','text','required')}${field('Telefone / WhatsApp','phone')}${field('Bairro / endereço (opcional)','address') }<div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions"><button>Salvar cliente</button></div></form></section><section class="card"><h3>Clientes cadastrados</h3>${!db.clients.length?'<div class="empty">Nenhum cliente cadastrado.</div>':`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Contato</th><th>Compras</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'-')}<div class="muted">${esc(c.address||'')}</div></td><td>${money(db.sales.filter(s=>s.client===c.name).reduce((a,s)=>a+saleTotal(s),0))}</td></tr>`).join('')}</tbody></table></div>`}</section></div>`}
function debtPage(){let owing=db.sales.filter(s=>debt(s)>0);return `<h1 class="sectiontitle">Fiado e recebimentos</h1><div class="grid">${metric('Total pendente',money(owing.reduce((a,s)=>a+debt(s),0)))}${metric('Vendas em aberto',owing.length)}</div><div class="cards" style="margin-top:12px"><section class="card"><h3>Registrar pagamento de fiado</h3><form id="paymentForm"><div class="formgrid">${selectField('Venda em aberto','saleId',options(owing.map(s=>s.id+' — '+s.product+' — '+money(debt(s))),null,'Selecione a dívida'),'required')}${field('Data','date','date','required',today())}${field('Valor recebido (R$)','amount','number','required')}${selectField('Forma de recebimento','method',options(['Pix','Dinheiro','Cartão','Transferência'],'Pix'))}</div><div class="actions"><button>Salvar recebimento</button></div></form><p class="muted">Cada pagamento reduz o saldo pendente da venda selecionada.</p></section><section class="card"><h3>Dívidas em aberto</h3>${owing.length?salesTable(owing):'<div class="empty">Nenhuma dívida pendente. 🎉</div>'}</section></div>`}
function reportsPage(){let from=$('#fromDate')?.value||new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10),to=$('#toDate')?.value||today();let list=db.sales.filter(s=>s.date>=from&&s.date<=to),rev=list.reduce((a,s)=>a+saleTotal(s),0),cost=list.reduce((a,s)=>a+costForSale(s),0),received=list.reduce((a,s)=>a+(s.pay==='Fiado'?Math.min(saleTotal(s),db.payments.filter(p=>p.saleId===s.id).reduce((a,p)=>a+Number(p.amount),0)):Number(s.received??saleTotal(s))),0),profit=rev-cost;
return `<h1 class="sectiontitle">Relatórios</h1><section class="card"><div class="formgrid"><div class="field"><label>De</label><input id="fromDate" type="date" value="${from}"></div><div class="field"><label>Até</label><input id="toDate" type="date" value="${to}"></div></div><div class="actions"><button id="applyDates">Aplicar período</button><button class="secondary" id="exportCSV">Exportar vendas CSV</button></div></section><div class="grid" style="margin-top:12px">${metric('Faturamento',money(rev))}${metric('Custo dos produtos',money(cost))}${metric('Lucro bruto estimado',money(profit))}${metric('Recebido nas vendas',money(received))}</div><section class="card" style="margin-top:12px"><h3>Vendas no período (${list.length})</h3>${salesTable(list)}</section><section class="card" style="margin-top:12px"><h3>Desempenho por produto</h3>${productReport(list)}</section><p class="muted">Lucro bruto estimado não desconta despesas extras, perdas, embalagem, energia, taxas ou entrega, a menos que já estejam incluídas no custo unitário.</p>`}
function productReport(list){if(!db.products.length)return '<div class="empty">Cadastre produtos para ver este relatório.</div>';return `<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Unidades vendidas</th><th>Faturamento</th><th>Lucro bruto</th></tr></thead><tbody>${db.products.map(p=>{let a=list.filter(s=>s.product===p.name),q=a.reduce((x,s)=>x+Number(s.qty),0),r=a.reduce((x,s)=>x+saleTotal(s),0),l=a.reduce((x,s)=>x+saleTotal(s)-costForSale(s),0);return `<tr><td>${esc(p.name)}</td><td>${q}</td><td>${money(r)}</td><td>${money(l)}</td></tr>`}).join('')}</tbody></table></div>`}
function backupPage(){return `<h1 class="sectiontitle">Configurações e backup</h1><section class="card"><h3>Dados e segurança</h3><p class="muted">Por padrão, os dados ficam neste navegador. Faça backup para não perder informações ao limpar os dados do aparelho.</p><div class="actions"><button id="exportJSON">Baixar backup completo</button><label class="secondary" style="padding:11px 14px;border-radius:11px;cursor:pointer">Restaurar backup <input id="importJSON" type="file" accept="application/json" hidden></label><button class="secondary" id="printReport">Imprimir resumo</button></div></section><section class="card" style="margin-top:12px"><h3>Sincronização na nuvem (opcional)</h3><p class="muted">Configure um projeto Supabase gratuito para sincronizar os mesmos dados em diferentes aparelhos. Siga o arquivo LEIA-ME.txt incluído no pacote e depois preencha as configurações no código do app.</p><div class="notice" id="cloudInfo">Nuvem não configurada. O aplicativo continua funcionando neste aparelho.</div><div class="loginrow"><input id="email" type="email" placeholder="Seu e-mail"><input id="password" type="password" placeholder="Senha (mín. 6 caracteres)"></div><div class="actions"><button id="signup">Criar conta na nuvem</button><button class="secondary" id="login">Entrar</button><button class="secondary" id="syncNow">Sincronizar agora</button><button class="danger" id="logout">Sair da nuvem</button></div></section><section class="card" style="margin-top:12px"><h3>Limpar dados</h3><p class="muted">Esta ação apaga os dados deste aparelho. Baixe um backup antes.</p><button class="danger" id="clearData">Apagar todos os dados locais</button></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receipt(b.dataset.receipt));$('#productForm')?.addEventListener('submit',e=>{e.preventDefault();let d=formData(e.target);if(db.products.some(p=>p.name.toLowerCase()===d.name.trim().toLowerCase()))return alert('Já existe um produto com esse nome.');db.products.push({id:id(),name:d.name.trim(),category:d.category,cost:+d.cost,price:+d.price,stock:+d.stock});saveLocal();render();alert('Produto cadastrado!')});
$('#clientForm')?.addEventListener('submit',e=>{e.preventDefault();let d=formData(e.target);db.clients.push({id:id(),...d,name:d.name.trim()});saveLocal();render();alert('Cliente cadastrado!')});
$('#saleForm')?.addEventListener('change',updateSaleCalc);$('#saleForm')?.addEventListener('input',updateSaleCalc);
$('#saleForm')?.addEventListener('submit',e=>{e.preventDefault();let d=formData(e.target),p=productByName(d.product);if(!p)return alert('Cadastre e selecione um produto.');let qty=+d.qty,stock=+p.stock-soldQty(p.name);if(qty<=0)return alert('Quantidade inválida.');if(qty>stock)return alert('Estoque insuficiente. Estoque atual: '+stock);let total=qty*+d.price,rec=d.pay==='Fiado'?Math.min(total,+d.received||0):total;if(d.pay!=='Fiado'&&d.received!==''&&+d.received<total)return alert('Para esta forma de pagamento, o valor recebido precisa cobrir o total.');let s={id:d.id||id(),date:d.date,product:d.product,qty,price:+d.price,cost:+d.cost,client:d.client,pay:d.pay,received:rec,notes:d.notes};db.sales.push(s);saveLocal();let sid=s.id;render();receipt(sid)});
$('#paymentForm')?.addEventListener('submit',e=>{e.preventDefault();let d=formData(e.target),sid=d.saleId.split(' — ')[0],s=db.sales.find(s=>s.id===sid);if(!s)return alert('Selecione uma venda válida.');let amount=+d.amount;if(amount<=0||amount>debt(s)+0.001)return alert('Informe um valor maior que zero e não superior ao saldo pendente ('+money(debt(s))+').');db.payments.push({id:id(),saleId:sid,date:d.date,amount,method:d.method});saveLocal();render();alert('Pagamento registrado!')});
document.querySelectorAll('[data-delproduct]').forEach(b=>b.onclick=()=>{let p=db.products.find(p=>p.id===b.dataset.delproduct);if(confirm('Excluir '+p.name+'? As vendas antigas ficam no histórico.')){db.products=db.products.filter(x=>x.id!==p.id);saveLocal();render()}});
$('#applyDates')?.addEventListener('click',()=>render());$('#exportCSV')?.addEventListener('click',exportCSV);$('#exportJSON')?.addEventListener('click',exportJSON);$('#importJSON')?.addEventListener('change',importJSON);$('#printReport')?.addEventListener('click',()=>window.print());$('#clearData')?.addEventListener('click',()=>{if(confirm('Tem certeza? Baixe backup antes.')){db=blank();saveLocal();render()}});
$('#signup')?.addEventListener('click',signUp);$('#login')?.addEventListener('click',signIn);$('#logout')?.addEventListener('click',signOut);$('#syncNow')?.addEventListener('click',syncCloud);
}
function updateSaleCalc(){let f=$('#saleForm');if(!f)return;let d=formData(f),p=productByName(d.product);if(p){if(!f.price.value)f.price.value=p.price;if(!f.cost.value)f.cost.value=p.cost;let total=(+f.qty.value||0)*(+f.price.value||0);$('#saleCalc').innerHTML=`Total: <b>${money(total)}</b> • Estoque disponível: <b>${Math.max(0,+p.stock-soldQty(p.name))}</b> un. • Lucro bruto estimado: <b>${money(total-(+f.qty.value||0)*(+f.cost.value||0))}</b>`}else $('#saleCalc').textContent='Escolha um produto para ver o total.'}
function receipt(sid){let s=db.sales.find(x=>x.id===sid);if(!s)return;let body=`<div class="receipt"><h2>🍰 Comprovante de venda</h2><p style="text-align:center">Meu Controle de Doces</p><hr><p><b>Venda:</b> ${esc(s.id)}<br><b>Data:</b> ${fmtDate(s.date)}<br><b>Cliente:</b> ${esc(s.client||'Não informado')}</p><hr><p><b>Produto:</b> ${esc(s.product)}<br><b>Quantidade:</b> ${s.qty}<br><b>Valor unitário:</b> ${money(s.price)}<br><b>Total:</b> ${money(saleTotal(s))}<br><b>Pagamento:</b> ${esc(s.pay)}<br><b>Recebido:</b> ${money(receivedForSale(s))}<br><b>Saldo pendente:</b> ${money(debt(s))}</p>${s.notes?`<p><b>Observações:</b> ${esc(s.notes)}</p>`:''}<hr><p style="text-align:center">Obrigado pela preferência!</p><button class="no-print" onclick="window.print()">Imprimir / salvar PDF</button></div>`;
let w=window.open('','_blank');if(w){w.document.write('<html><head><title>Comprovante</title><meta name="viewport" content="width=device-width"><style>body{font:16px Arial;padding:20px;max-width:500px;margin:auto}button{padding:10px;background:#173d32;color:white;border:0;border-radius:8px}</style></head><body>'+body+'</body></html>');w.document.close()}else alert('O navegador bloqueou a janela. Permita pop-ups para imprimir o comprovante.')}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download('backup-meu-controle-doces-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function importJSON(e){let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.sales||!d.clients)throw Error();if(confirm('Substituir os dados atuais pelo backup?')){db={...blank(),...d};saveLocal();render();alert('Backup restaurado.')}}catch{alert('Arquivo de backup inválido.')}};r.readAsText(file)}
function exportCSV(){let rows=[['Data','ID','Produto','Quantidade','Preço unitário','Total','Custo unitário','Lucro bruto','Cliente','Pagamento','Recebido','Saldo pendente'],...db.sales.map(s=>[s.date,s.id,s.product,s.qty,s.price,saleTotal(s),s.cost,saleTotal(s)-costForSale(s),s.client,s.pay,receivedForSale(s),debt(s)])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('relatorio-vendas-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function updateStatus(){$('#modeStatus').textContent=user?'Nuvem conectada':'Modo local';let n=$('#cloudNotice');if(n){if(!cloudConfigured){n.classList.remove('hidden');n.textContent='Modo local: os dados ficam neste navegador até você configurar a sincronização na nuvem.'}else if(!user){n.classList.remove('hidden');n.textContent='Nuvem configurada, mas você ainda não entrou na sua conta.'}else n.classList.add('hidden')}}
const CLOUD_URL = "https://lilwiypnykgaebimyonf.supabase.co";
const CLOUD_KEY =sb_publishable_.;
function initCloud(){cloudConfigured=!!(CLOUD_URL.startsWith('https://')&&CLOUD_KEY.length>30&&!CLOUD_URL.includes('COLE_AQUI')&&!CLOUD_KEY.includes('COLE_AQUI'));if(cloudConfigured&&window.supabase){supa=window.supabase.createClient(CLOUD_URL,CLOUD_KEY);supa.auth.onAuthStateChange((_e,session)=>{user=session?.user||null;updateStatus()})}updateStatus()}
async function signUp(){if(!cloudConfigured)return alert('Primeiro configure a URL e a chave do Supabase seguindo LEIA-ME.txt.');let email=$('#email').value,password=$('#password').value;if(!email||password.length<6)return alert('Informe e-mail e senha com pelo menos 6 caracteres.');let {error}=await supa.auth.signUp({email,password});alert(error?error.message:'Cadastro solicitado. Confira seu e-mail se a confirmação estiver ativada.');}
async function signIn(){if(!cloudConfigured)return alert('Primeiro configure a URL e a chave do Supabase seguindo LEIA-ME.txt.');let {data,error}=await supa.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return alert(error.message);user=data.user;await syncCloud(true);render();alert('Entrou na nuvem.')}
async function signOut(){if(supa)await supa.auth.signOut();user=null;updateStatus();render()}
async function syncCloud(pull=false){if(!cloudConfigured||!supa)return alert('A nuvem ainda não foi configurada.');if(!user){let {data}=await supa.auth.getUser();user=data.user}if(!user)return alert('Entre na sua conta da nuvem primeiro.');try{if(pull){let {data,error}=await supa.from('app_state').select('payload').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.payload&&confirm('Substituir os dados deste aparelho pelos dados salvos na nuvem?')){db={...blank(),...data.payload};saveLocal();render()}return}let {error}=await supa.from('app_state').upsert({user_id:user.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;alert('Dados sincronizados com a nuvem.')}catch(e){alert('Não foi possível sincronizar: '+e.message+'\\nConfira o SQL e as configurações no LEIA-ME.txt.')}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
initCloud();render();
